---
- name: Configurar usuarios e seguranca SSH
  hosts: todos
  become: true

  tasks:
    - name: Criar usuario emanuel e gerar seu par de chaves SSH
      ansible.builtin.user:
        name: emanuel
        groups: ifpb
        append: true
        shell: /bin/bash
        create_home: true
        generate_ssh_key: true
        ssh_key_type: ed25519
        ssh_key_file: .ssh/id_ed25519
        state: present

    - name: Ler a chave publica gerada no host cli
      ansible.builtin.slurp:
        src: /home/emanuel/.ssh/id_ed25519.pub
      register: emanuel_pub_key
      when: inventory_hostname == 'cli'

    - name: Autorizar a chave publica do usuario emanuel em todas as maquinas
      ansible.posix.authorized_key:
        user: emanuel
        key: "{{ hostvars['cli']['emanuel_pub_key']['content'] | b64decode }}"
        state: present

    - name: Configurar sudo para grupo ifpb
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ifpb
        content: "%ifpb ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Criar banner SSH
      ansible.builtin.copy:
        dest: /etc/ssh/banner
        content: "Acesso apenas para pessoas com autorização expressa!!!\n"
        owner: root
        group: root
        mode: '0644'

    - name: Configurar diretivas de seguranca no sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?AllowGroups', line: 'AllowGroups vagrant ifpb' }
        - { regexp: '^#?Banner', line: 'Banner /etc/ssh/banner' }
      notify: Reiniciar SSH

  handlers:
    - name: Reiniciar SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
