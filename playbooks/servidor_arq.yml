---
- name: Configurar servidor de arquivos ARQ
  hosts: arq
  become: true

  tasks:
    - name: Instalar servicos DHCP, DNS, NFS e LVM
      ansible.builtin.apt:
        name:
          - isc-dhcp-server
          - bind9
          - bind9-utils
          - dnsutils
          - nfs-kernel-server
          - lvm2
        state: present
        update_cache: true

    - name: Criar Volume Group dados com os 3 discos adicionais
      community.general.lvg:
        vg: dados
        pvs: /dev/sdb,/dev/sdc,/dev/sdd
        state: present

    - name: Criar Logical Volume ifpb de 15GB
      community.general.lvol:
        vg: dados
        lv: ifpb
        size: 15g
        state: present

    - name: Formatar LV ifpb com ext4
      community.general.filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb

    - name: Garantir diretorio /dados
      ansible.builtin.file:
        path: /dados
        state: directory
        mode: '0755'

    - name: Montar /dev/dados/ifpb em /dados persistentemente
      ansible.posix.mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        opts: defaults
        state: mounted

    - name: Criar grupo nfs-ifpb
      ansible.builtin.group:
        name: nfs-ifpb
        gid: 2000
        state: present

    - name: Criar usuario nfs-ifpb sem shell
      ansible.builtin.user:
        name: nfs-ifpb
        uid: 2000
        group: nfs-ifpb
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Configurar diretorio NFS
      ansible.builtin.file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0770'

    - name: Configurar exportacao NFS
      ansible.builtin.copy:
        dest: /etc/exports
        content: |
          /dados/nfs 192.168.56.0/24(rw,sync,no_subtree_check,all_squash,anonuid=2000,anongid=2000)
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar NFS

    - name: Configurar interface DHCP
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-server
        content: |
          INTERFACESv4="eth1"
          INTERFACESv6=""
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar DHCP

    - name: Configurar servidor DHCP
      ansible.builtin.copy:
        dest: /etc/dhcp/dhcpd.conf
        content: |
          authoritative;

          default-lease-time 180;
          max-lease-time 3600;

          option domain-name "emanuel.souza.devops";
          option domain-name-servers 192.168.56.129;

          subnet 192.168.56.0 netmask 255.255.255.0 {
              range 192.168.56.50 192.168.56.100;
              option routers 192.168.56.1;
              option subnet-mask 255.255.255.0;
              option broadcast-address 192.168.56.255;
          }

          host db {
              hardware ethernet 08:00:27:00:00:30;
              fixed-address 192.168.56.130;
          }

          host app {
              hardware ethernet 08:00:27:00:00:31;
              fixed-address 192.168.56.131;
          }
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar DHCP

    - name: Configurar opcoes do DNS
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        content: |
          options {
              directory "/var/cache/bind";

              recursion yes;
              allow-query { localhost; 192.168.56.0/24; };

              forwarders {
                  1.1.1.1;
                  8.8.8.8;
              };

              dnssec-validation no;

              listen-on { 127.0.0.1; 192.168.56.129; };
              listen-on-v6 { none; };
          };
        owner: root
        group: bind
        mode: '0644'
      notify: Reiniciar DNS

    - name: Configurar zonas DNS
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.local
        content: |
          zone "emanuel.souza.devops" {
              type master;
              file "/etc/bind/db.emanuel.souza.devops";
          };

          zone "56.168.192.in-addr.arpa" {
              type master;
              file "/etc/bind/db.192.168.56";
          };
        owner: root
        group: bind
        mode: '0644'
      notify: Reiniciar DNS

    - name: Criar zona DNS direta
      ansible.builtin.copy:
        dest: /etc/bind/db.emanuel.souza.devops
        content: |
          $TTL 604800
          @   IN  SOA arq.emanuel.souza.devops. admin.emanuel.souza.devops. (
                  2026112601
                  604800
                  86400
                  2419200
                  604800 )

          @       IN  NS  arq.emanuel.souza.devops.
          arq     IN  A   192.168.56.129
          db      IN  A   192.168.56.130
          app     IN  A   192.168.56.131
        owner: root
        group: bind
        mode: '0644'
      notify: Reiniciar DNS

    - name: Criar zona DNS reversa
      ansible.builtin.copy:
        dest: /etc/bind/db.192.168.56
        content: |
          $TTL 604800
          @   IN  SOA arq.emanuel.souza.devops. admin.emanuel.souza.devops. (
                  2026112601
                  604800
                  86400
                  2419200
                  604800 )

          @   IN  NS  arq.emanuel.souza.devops.
          129 IN  PTR arq.emanuel.souza.devops.
          130 IN  PTR db.emanuel.souza.devops.
          131 IN  PTR app.emanuel.souza.devops.
        owner: root
        group: bind
        mode: '0644'
      notify: Reiniciar DNS

    - name: Validar configuracoes DHCP e DNS
      ansible.builtin.command: "{{ item }}"
      loop:
        - dhcpd -t -cf /etc/dhcp/dhcpd.conf
        - named-checkconf
        - named-checkzone emanuel.souza.devops /etc/bind/db.emanuel.souza.devops
        - named-checkzone 56.168.192.in-addr.arpa /etc/bind/db.192.168.56
      changed_when: false

    - name: Aplicar exportacoes NFS
      ansible.builtin.command: exportfs -ra
      changed_when: false

    - name: Garantir servicos iniciados e habilitados
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - isc-dhcp-server
        - named
        - nfs-server

  handlers:
    - name: Reiniciar DHCP
      ansible.builtin.service:
        name: isc-dhcp-server
        state: restarted

    - name: Reiniciar DNS
      ansible.builtin.service:
        name: named
        state: restarted

    - name: Reiniciar NFS
      ansible.builtin.service:
        name: nfs-server
        state: restarted
