---
- name: Configurar servidor de banco de dados
  hosts: db
  become: true

  tasks:
    - name: Instalar MariaDB e autofs
      ansible.builtin.apt:
        name:
          - mariadb-server
          - mariadb-client
          - autofs
        state: present
        update_cache: true

    - name: Habilitar e iniciar MariaDB
      ansible.builtin.service:
        name: mariadb
        enabled: true
        state: started

    - name: Garantir diretorio de montagem NFS
      ansible.builtin.file:
        path: /var/nfs
        state: directory

    - name: Configurar mapa mestre do autofs
      ansible.builtin.lineinfile:
        path: /etc/auto.master
        line: '/- /etc/auto.nfs --timeout=60'
        state: present
      notify: Reiniciar autofs

    - name: Configurar montagem NFS do ARQ
      ansible.builtin.copy:
        dest: /etc/auto.nfs
        content: '/var/nfs -fstype=nfs,rw,sync 192.168.56.129:/dados/nfs'
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar autofs

    - name: Habilitar e iniciar autofs
      ansible.builtin.service:
        name: autofs
        enabled: true
        state: started

  handlers:
    - name: Reiniciar autofs
      ansible.builtin.service:
        name: autofs
        state: restarted
